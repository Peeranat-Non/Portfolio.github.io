<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peeranat Anunteratat — Portfolio</title>
<meta name="description" content="Portfolio ของ พีรณัฐ อนันต์ธีรทัต — Web Developer & Graphic Designer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Thai:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="progress"></div>
<div class="loader" aria-hidden="true"><span>Peeranat A.</span><i></i></div>
<header class="nav" id="navbar"></header>

<main>
  <section class="hero" id="hero">
    <div class="hero__text">
      <p class="label label--live fade">Portfolio — 2026</p>
      <h1 class="display"><span class="line"><span>Peeranat</span></span><span class="line"><span style="--d:.12s"><em>Anunteratat</em></span></span></h1>
      <p class="hero__sub fade" id="heroSub" style="--d:.3s"></p>
      <div class="hero__cta fade" style="--d:.45s">
        <a class="btn" href="#projects">ดูผลงาน <span class="btn__dot">↓</span></a>
        <a class="btn btn--ghost" href="#contact">ติดต่อ <span class="btn__dot">→</span></a>
      </div>
    </div>
    <figure class="arch" data-parallax="-0.06"><img src="assets/img/profile.jpg" alt="Peeranat Anunteratat"></figure>
  </section>

  <div class="marquee" aria-hidden="true"><div class="marquee__track" id="marquee"></div></div>

  <section class="section" id="about">
    <header class="section__head reveal"><span class="label"></span><h2>About</h2></header>
    <div class="about">
      <p class="about__lead" id="aboutLead"></p>
      <dl class="facts" id="facts"></dl>
    </div>
    <!-- <div class="stats" id="stats"></div>
    <ul class="skills" id="skills"></ul>
    <figure class="campus reveal"><img src="assets/img/sit.png" alt="คณะเทคโนโลยีสารสนเทศ มจธ. บางมด" loading="lazy"><figcaption class="label">เป้าหมาย — SIT, KMUTT บางมด</figcaption></figure> -->
  </section>

  <section class="section" id="projects">
    <header class="section__head reveal"><span class="label"></span><h2>Projects</h2></header>
    <!-- <p class="section__note">โปรเจกต์ที่พัฒนาและเก็บไว้บน GitHub</p> -->
    <div class="filters" id="filters"></div>
    <div class="grid" id="projectGrid"></div>
  </section>

  <section class="section" id="works">
    <header class="section__head reveal"><span class="label"></span><h2>Activities</h2></header>
    <ol class="index" id="activities"></ol>
  </section>

  <section class="section" id="education">
    <header class="section__head reveal"><span class="label"></span><h2>Education</h2></header>
    <ol class="timeline" id="education-list"></ol>
  </section>

  <section class="section" id="certificates">
    <header class="section__head reveal"><span class="label"></span><h2>Certificates</h2></header>
    <div class="certs" id="certs"></div>
  </section>

  <section class="section section--contact" id="contact">
    <header class="section__head reveal"><span class="label"></span><h2>Contact</h2></header>
    <a class="mail display" id="mail"></a>
    <p class="contact__line"><span class="label">Call</span> <span id="phone"></span></p>
    <p class="contact__line"><span class="label">Location</span> <span id="addr"></span></p>
    <div class="socials" id="socials"></div>
  </section>
</main>

<footer class="footer"><span class="label">© Peeranat Anunteratat</span><a class="label" href="#hero">กลับด้านบน ↑</a></footer>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
